<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT Dashboard — Live</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--bg-soft:#f7f7f5;--bg-info:#e6f1fb;
  --txt:#1a1a18;--txt-2:#5f5e5a;--txt-3:#888780;--txt-info:#185fa5;
  --br:rgba(0,0,0,0.12);--br-2:rgba(0,0,0,0.22);
  --r-md:8px;--r-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
  --c-psa:#3b82f6;--c-ll:#8b5cf6;
  --c-LL:#8b5cf6;--c-Porter:#06b6d4;--c-Admin:#10b981;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg-soft);color:var(--txt);padding:14px;min-height:100vh;}
.dash{max-width:1200px;margin:0 auto;}
.header{margin-bottom:1rem;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.h-l h1{font-size:21px;font-weight:600;}
.h-l p{font-size:12.5px;color:var(--txt-2);margin-top:4px;}
.dept-toggle{display:flex;background:var(--bg);border:0.5px solid var(--br);border-radius:var(--r-md);padding:3px;gap:2px;}
.dept-btn{padding:7px 18px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--txt-2);font-size:13px;font-weight:500;font-family:var(--font);transition:all .15s;}
.dept-btn.active{color:#fff;}
.dept-btn.active.psa{background:var(--c-psa);}
.dept-btn.active.ll{background:var(--c-ll);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;overflow-x:auto;}
.tab{padding:6px 14px;border-radius:var(--r-md);border:0.5px solid var(--br);font-size:12.5px;cursor:pointer;color:var(--txt-2);background:var(--bg);transition:all .12s;font-family:var(--font);white-space:nowrap;}
.tab:hover{border-color:var(--br-2);color:var(--txt);}
.tab.active{background:var(--bg-info);color:var(--txt-info);border-color:transparent;font-weight:500;}
.tab.ov.active{background:#1a1a18;color:#f5f5f3;}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
.btn{padding:7px 13px;border-radius:var(--r-md);border:0.5px solid var(--br);font-size:12px;cursor:pointer;background:var(--bg);color:var(--txt);transition:all .12s;font-family:var(--font);display:inline-flex;align-items:center;gap:5px;font-weight:500;white-space:nowrap;}
.btn:hover{border-color:var(--br-2);background:var(--bg-soft);}
.btn.primary{background:var(--bg-info);color:var(--txt-info);border-color:#85b7eb;}
.btn.success{background:#dcfce7;color:#15803d;border-color:#86efac;}
.btn.warning{background:#fef3c7;color:#a16207;border-color:#fcd34d;}
.btn[disabled]{opacity:.55;cursor:not-allowed;pointer-events:none;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem;}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1rem;}
@media(max-width:1024px){.g4,.g5{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g4,.g5{grid-template-columns:1fr;}.header{flex-direction:column;}}
.metric{background:var(--bg);border:0.5px solid var(--br);border-radius:var(--r-md);padding:13px 15px;}
.metric-l{font-size:11.5px;color:var(--txt-2);margin-bottom:5px;}
.metric-v{font-size:19px;font-weight:600;color:var(--txt);}
.metric-s{font-size:11px;color:var(--txt-3);margin-top:3px;}
.card{background:var(--bg);border:0.5px solid var(--br);border-radius:var(--r-lg);padding:1.15rem 1.4rem;margin-bottom:1rem;overflow:hidden;}
.card-t{font-size:13.5px;font-weight:600;color:var(--txt);margin-bottom:13px;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{font-size:11px;font-weight:500;color:var(--txt-2);text-align:left;padding:7px 8px;border-bottom:0.5px solid var(--br);white-space:nowrap;background:var(--bg-soft);}
td{padding:7px 8px;border-bottom:0.5px solid var(--br);color:var(--txt);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg-soft);}
.badge{font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:4px;display:inline-block;}
.tot td{font-weight:600;background:var(--bg-soft);}
.barcell{display:flex;align-items:center;gap:8px;}
.barbg{height:6px;border-radius:3px;background:var(--br);flex:1;min-width:50px;}
.barfill{height:6px;border-radius:3px;}
.leg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;font-size:11px;}
.legitem{display:flex;align-items:center;gap:5px;color:var(--txt-2);}
.legdot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.notice{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:1rem;display:none;}
.notice.show{display:block;}
.notice.info{background:var(--bg-info);color:var(--txt-info);border:0.5px solid #85b7eb;}
.notice.success{background:#dcfce7;color:#15803d;border:0.5px solid #86efac;}
.notice.error{background:#fee2e2;color:#b91c1c;border:0.5px solid #fca5a5;}
.notice.warning{background:#fef3c7;color:#a16207;border:0.5px solid #fcd34d;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;}
.btn .spin{border-color:#0003;border-top-color:currentColor;}
@keyframes sp{to{transform:rotate(360deg);}}
.upload-zone{border:2px dashed var(--br-2);border-radius:var(--r-md);padding:12px;text-align:center;background:var(--bg-soft);cursor:pointer;transition:all .12s;font-size:12px;color:var(--txt-2);margin-bottom:0.75rem;}
.upload-zone:hover{border-color:var(--c-psa);color:var(--c-psa);}
#editModal{display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
#editModal.show{display:flex;}
.edit-box{background:var(--bg);border:0.5px solid var(--br-2);border-radius:var(--r-lg);padding:22px 26px;width:100%;max-width:780px;box-shadow:0 12px 40px rgba(0,0,0,.18);}
.edit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:0.5px solid var(--br);}
.edit-title{font-size:15px;font-weight:600;}
.edit-sub{font-size:11px;color:var(--txt-2);margin-top:2px;}
.edit-close{background:transparent;border:none;cursor:pointer;color:var(--txt-2);padding:6px;border-radius:6px;font-family:var(--font);font-size:14px;}
.edit-close:hover{background:var(--bg-soft);color:var(--txt);}
.edit-section{margin-bottom:14px;}
.edit-section-t{font-size:11.5px;font-weight:600;color:var(--txt-2);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.5px;}
.edit-grid{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;}
.edit-grid-h{font-size:11px;color:var(--txt-3);font-weight:500;text-align:center;padding:4px 0;}
.edit-grid-h.lbl{text-align:left;}
.edit-input{padding:6px 10px;border:0.5px solid var(--br);border-radius:6px;background:var(--bg);color:var(--txt);font-size:12px;font-family:var(--font);width:100%;text-align:center;}
.edit-input:focus{outline:none;border-color:var(--c-ll);box-shadow:0 0 0 2px rgba(139,92,246,.15);}
.edit-row-l{font-size:12px;font-weight:500;}
.edit-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:0.5px solid var(--br);align-items:center;flex-wrap:wrap;}
.edit-hint{font-size:10.5px;color:var(--txt-3);flex:1;}
.code-grid{display:grid;grid-template-columns:60px repeat(3,1fr);gap:6px;align-items:center;margin-bottom:4px;}
.code-grid-h{font-size:10px;color:var(--txt-3);font-weight:500;text-align:center;}
.code-grid-h.lbl{text-align:left;}
.code-input{padding:4px 6px;border:0.5px solid var(--br);border-radius:4px;background:var(--bg);color:var(--txt);font-size:11px;font-family:var(--font);width:100%;text-align:center;}
.code-row-l{font-size:11px;font-weight:600;color:var(--c-ll);}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
.last-update{font-size:10.5px;color:var(--txt-3);margin-left:auto;align-self:center;}
@media print{
  @page{size:A4;margin:14mm 12mm;}
  body{background:#fff !important;padding:0 !important;color:#000 !important;font-size:11px;}
  .tabs,.actions,.dept-toggle,.upload-zone,.notice,#editModal,.no-print,.last-update{display:none !important;}
  .dash{max-width:100% !important;}
  .card{page-break-inside:avoid;break-inside:avoid;border:1px solid #cbd5e1 !important;margin-bottom:10px !important;padding:0.8rem 1rem !important;box-shadow:none !important;background:#fff !important;}
  .header{margin-bottom:10px !important;padding-bottom:8px;border-bottom:2px solid #1e40af;}
  .h-l h1{font-size:18px !important;color:#1e40af !important;}
  .h-l h1 span{display:none;}
  .h-l p{font-size:11px !important;color:#475569 !important;}
  .header::after{content:'Generated: ' attr(data-date) ' • PSA + LL Overtime Report';display:block;font-size:9px;color:#64748b;margin-top:4px;}
  .metric{padding:8px 10px !important;}
  .metric-l{font-size:9px !important;}
  .metric-v{font-size:14px !important;font-weight:600 !important;}
  .metric-s{font-size:8px !important;}
  .card-t{font-size:12px !important;font-weight:600 !important;color:#1e40af !important;margin-bottom:8px !important;}
  table{font-size:9px !important;border-collapse:collapse;}
  th,td{padding:3px 5px !important;border:0.5px solid #cbd5e1 !important;}
  th{background:#f1f5f9 !important;color:#1e293b !important;font-weight:600 !important;}
  .badge{font-size:9px !important;padding:1px 5px !important;}
  .leg{font-size:8px !important;gap:4px 8px !important;}
  .card[style*="fef3c7"]{background:#fef9c3 !important;border-color:#a16207 !important;}
  canvas{print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="dash">

  <div class="header" id="dashHeader">
    <div class="h-l">
      <h1>OT Dashboard <span style="font-size:11px;font-weight:500;color:var(--txt-3);background:var(--bg-info);color:var(--txt-info);padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle">LIVE</span></h1>
      <p id="hdr-sub">PSA — Overtime by team (weekly) • Oct 2025 – May 2026</p>
    </div>
    <div class="dept-toggle">
      <button class="dept-btn psa active" id="btnPSA" onclick="setDept('PSA')">PSA</button>
      <button class="dept-btn ll" id="btnLL" onclick="setDept('LL')">LL</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="btnRefreshAll" onclick="refreshAll()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh All
    </button>
    <button class="btn" id="btnTemplate" onclick="setTemplateId()" title="ใช้ Admin Template (long format) เป็น single source — PSA + LL ในไฟล์เดียว">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      <span id="tplLbl">Template</span>
    </button>
    <button class="btn" id="btnAuto" onclick="toggleAutoRefresh()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="autoLbl">Auto: ON · 15 min</span>
    </button>
    <label class="btn" style="cursor:pointer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload PSA Flight CSV
      <input type="file" id="psaCsv" accept=".csv,.tsv,.txt" style="display:none" onchange="handlePsaCsv(event)">
    </label>
    <button class="btn" onclick="window.print()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / PDF
    </button>
    <button class="btn" onclick="exportCsv()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Export CSV
    </button>
    <button class="btn" onclick="backupJson()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
      Backup
    </button>
    <button class="btn success" onclick="downloadStandalone()" title="ดาวน์โหลด HTML ฉบับเดียวจบ ส่งให้ผู้บริหารดูได้">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Share for Exec
    </button>
    <span class="last-update" id="lastUpdate"></span>
  </div>

  <div class="notice" id="notice"></div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

</div>

<div id="editModal">
  <div class="edit-box">
    <div class="edit-head">
      <div>
        <div class="edit-title" id="editTitle">แก้ไขข้อมูล LL</div>
        <div class="edit-sub">ค่าที่แก้จะ override ข้อมูล Drive (เก็บใน browser localStorage)</div>
      </div>
      <button class="edit-close" onclick="closeEditForm()">✕</button>
    </div>
    <div id="editBody"></div>
    <div class="edit-actions">
      <span class="edit-hint">💾 บันทึกลง browser — กด Refresh from Drive เพื่อดึงข้อมูลใหม่</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-danger" onclick="resetMonthOverride()">รีเซ็ตเดือนนี้</button>
        <button class="btn" onclick="closeEditForm()">ยกเลิก</button>
        <button class="btn primary" onclick="saveEditForm()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

// ---------- Custom Chart.js plugin: value labels on bars (overlap-aware) ----------
const valueLabelsPlugin = {
  id: 'valueLabels',
  afterDatasetsDraw(chart, args, opts){
    if(!opts || !opts.display) return;
    const ctx = chart.ctx;
    const fmtFn = opts.format || (v => v);
    const horiz = chart.options.indexAxis === 'y';
    const dsCount = chart.data.datasets.filter(d => d.type !== 'line').length;
    const isGrouped = dsCount > 1;

    const placements = [];
    const fmtLineFn = opts.formatLine || fmtFn;
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if(meta.hidden) return;
      const isLine = ds.type === 'line';
      meta.data.forEach((el, i) => {
        const val = ds.data[i];
        if(val == null || val === 0) return;
        const text = isLine ? fmtLineFn(val) : fmtFn(val);
        let color = opts.color;
        if(!color) {
          const bg = ds.backgroundColor;
          color = isLine ? (ds.borderColor || '#5f5e5a')
                          : (typeof bg === 'string' ? bg : (Array.isArray(bg) ? bg[i] : '#5f5e5a'));
        }
        let x, y, align, baseline, rot=0;
        if(horiz){
          x = el.x + 4; y = el.y; align = 'left'; baseline = 'middle';
        } else {
          x = el.x;
          y = isLine ? el.y + 14 : el.y - 4;
          align = 'center';
          baseline = isLine ? 'top' : 'bottom';
          if(isGrouped && !isLine && el.width && ctx){
            ctx.font = (opts.font || 'bold 10px') + ' sans-serif';
            const tw = ctx.measureText(text).width;
            if(tw > el.width * 0.95){ rot = -Math.PI/4; baseline='middle'; align='left'; y = el.y - 2; }
          }
        }
        placements.push({x, y, text, color, align, baseline, rot, font: opts.font || 'bold 10px', isLine});
      });
    });

    for(let i = 1; i < placements.length; i++){
      const a = placements[i-1], b = placements[i];
      if(!horiz && Math.abs(a.x - b.x) < 18 && Math.abs(a.y - b.y) < 12){
        b.y -= 11;
      }
    }

    placements.forEach(p => {
      ctx.save();
      ctx.fillStyle = p.color;
      ctx.font = p.font + ' sans-serif';
      ctx.textAlign = p.align;
      ctx.textBaseline = p.baseline;
      if(p.isLine){
        const tw = ctx.measureText(p.text).width;
        const pad = 3;
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.fillRect(p.x - tw/2 - pad, p.y - 1, tw + pad*2, 13);
        ctx.fillStyle = p.color;
      }
      if(p.rot){
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillText(p.text, 0, 0);
      } else {
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.restore();
    });
  }
};

}

// ---------- Parser: OT LL Summary ----------
function unwrapMcpResult(raw){
  if(raw==null)return '';
  if(typeof raw==='string')return raw;
  if(raw.structuredContent&&typeof raw.structuredContent.fileContent==='string'&&raw.structuredContent.fileContent.length>10){
    return raw.structuredContent.fileContent;
  }
  if(Array.isArray(raw.content)&&raw.content[0]&&typeof raw.content[0].text==='string'){
    const t=raw.content[0].text;
    try{
      const j=JSON.parse(t);
      if(j&&typeof j.fileContent==='string'){return j.fileContent;}
    }catch(e){}
    if(t.length>10){return t;}
  }
  if(Array.isArray(raw.content)){
    const t=raw.content.map(c=>typeof c==='string'?c:(c&&(c.text||c.fileContent||c.value||c.data||(c.resource&&(c.resource.text||c.resource.fileContent))))||'').filter(Boolean).join('\n');
    if(t.length>10){return t;}
  }
  if(typeof raw.fileContent==='string')return raw.fileContent;
  if(typeof raw.text==='string')return raw.text;
  try{return JSON.stringify(raw);}catch(e){return '';}
}

function spanToMin(cell){
  if(cell==null)return 0;
  const s=String(cell);
  const m=s.match(/hours="(\d+)"\s*minutes="(\d+)"/);
  if(m)return parseInt(m[1])*60+parseInt(m[2]);
  const t=s.match(/(\d+):(\d+)(?::\d+)?/);
  if(t)return parseInt(t[1])*60+parseInt(t[2]);
  return 0;
}

function pipeRow(line){
  const t=line.trim();
  if(!t.startsWith('|'))return null;
  let s=t;
  if(s.startsWith('|'))s=s.slice(1);
  if(s.endsWith('|'))s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim());
}

function parseLLSummary(text){
  let workText=text;
  const sStart=workText.indexOf('# Summary');
  if(sStart>=0){
    workText=workText.slice(sStart);
    const next=workText.search(/\n# (?!Summary)/);
    if(next>0)workText=workText.slice(0,next);
  }
  const lines=workText.split('\n');
  const data={};
  let curYear=null,curMonths=[];
  for(const raw of lines){
    const cells=pipeRow(raw);
    if(!cells||cells.length<2)continue;
    if(/^:-+:?$/.test(cells[0]))continue;
    if(/^\d{4}$/.test(cells[0])&&cells[1]==='LL'){
      curYear=cells[0];
      curMonths=cells.slice(5).filter(c=>MONTH_ORDER.includes(c));
      continue;
    }
    if(!curYear)continue;
    if(MONTH_ORDER.includes(cells[0])){
      const mk=MONTH_ABBR[cells[0]]+' '+curYear;
      data[mk]={LL_min:spanToMin(cells[1]),Porter_min:spanToMin(cells[2]),Admin_min:spanToMin(cells[3]),Total_min:spanToMin(cells[4]),codes:{}};
    }
    if(cells.length>5){
      const tag=cells[5];
      if(/^A[1-8]$/.test(tag)){
        for(let mi=0;mi<curMonths.length;mi++){
          const off=5+mi*5;
          if(off+3>=cells.length)break;
          const mk=MONTH_ABBR[curMonths[mi]]+' '+curYear;
          if(!data[mk])data[mk]={LL_min:0,Porter_min:0,Admin_min:0,Total_min:0,codes:{}};
          data[mk].codes[tag]={LL_min:spanToMin(cells[off+1]),Porter_min:spanToMin(cells[off+2]),Admin_min:spanToMin(cells[off+3])};
        }
      }
    }
  }
  return data;
}

function buildMonthList(data){
  const keys=Object.keys(data);
  const parsed=keys.map(k=>{
    const m=k.match(/^([A-Z][a-z]{2}) (\d{4})$/);
    if(!m)return null;
    const monthIdx=Object.values(MONTH_ABBR).indexOf(m[1]);
    return{key:k,year:parseInt(m[2]),month:monthIdx};
  }).filter(Boolean);
  parsed.sort((a,b)=>a.year-b.year||a.month-b.month);
  return parsed.map(p=>p.key);
}

// Normalize an LL month record to the flat shape the front-end expects.
// Apps Script (getLLData_) returns {summary:{LL_min,..},codes:{..},codeTotal,discrepancy};
// the offline baseline uses either the weekly shape {weeks:[..]} or the flat
// shape {LL_min,Porter_min,Admin_min,Total_min,codes:{..}}. This collapses the
// Apps Script shape into the flat one so every helper (activeMonths/llCatMonth/…)
// keeps working and the month doesn't silently disappear.
function normalizeLLRecord(r){
  if(!r||typeof r!=='object')return r;
  if(Array.isArray(r.weeks))return r;     // weekly shape — handled directly
  if('LL_min' in r)return r;              // already flat
  if(r.summary&&typeof r.summary==='object'){
    const s=r.summary;
    return {
      LL_min:s.LL_min||0,Porter_min:s.Porter_min||0,Admin_min:s.Admin_min||0,
      Total_min:s.Total_min||((s.LL_min||0)+(s.Porter_min||0)+(s.Admin_min||0)),
      codes:r.codes||{}
    };
  }
  return r;
}

// Total minutes carried by an LL record (handles weekly + flat shapes).
function llRecTotal(r){
  if(!r||typeof r!=='object')return 0;
  if(Array.isArray(r.weeks))return r.weeks.reduce((a,w)=>a+(w.LL_min||0)+(w.Porter_min||0)+(w.Admin_min||0),0);
  return (r.LL_min||0)+(r.Porter_min||0)+(r.Admin_min||0);
}

// Merge a live LL payload over the offline baseline. Each live month is
// normalized to the flat shape; only months that actually carry data override
// the baseline. This is the key fix for "LL ไม่ขึ้น": a live source that hasn't
// been filled in yet (empty/zero months) can no longer blank out a month that
// has curated offline values like May 2026 — the offline numbers stay visible.
function applyLiveLL(newLL){
  if(!newLL||typeof newLL!=='object')return;
  Object.keys(newLL).forEach(k=>{
    if(k.startsWith('_'))return;
    const r=normalizeLLRecord(newLL[k]);
    if(llRecTotal(r)>0)LL_DATA[k]=r;
  });
  LL_MONTH_LIST=activeMonths(LL_DATA);
}

function activeMonths(data){
  const all=buildMonthList(data);
  return all.filter(k=>{
    const r=data[k];if(!r)return false;
    if(Array.isArray(r.weeks)){
      return r.weeks.reduce((a,w)=>a+(w.LL_min||0)+(w.Porter_min||0)+(w.Admin_min||0),0)>0;
    }
    return ((r.LL_min||0)+(r.Porter_min||0)+(r.Admin_min||0))>0;
  });
}

let LAST_DEBUG=null;

async function refreshLL(){
  const btn=document.getElementById('btnRefresh');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> กำลังโหลด...';}
  showNotice('กำลังดึงข้อมูล LL จาก Google Drive...','info');

    stage='calling MCP read';
    let text='';
    let usedFallback=false;

      const raw=await window.cowork.callMcpTool(READ_TOOL,{fileId:OT_LL_FILE_ID});

      text=unwrapMcpResult(raw);
    }catch(e){
      readErr=e;
    }
    if(!text||text.length<200){
      stage='calling MCP metadata (fallback)';
      try{
        const meta=await window.cowork.callMcpTool(META_TOOL,{fileId:OT_LL_FILE_ID});
        const m=meta&&typeof meta==='object'?meta:JSON.parse(unwrapMcpResult(meta)||'{}');
        const snip=m.contentSnippet||(m.content&&m.content[0]&&m.content[0].text?m.content[0].text:null);
        if(snip&&snip.length>200){text=snip;usedFallback=true;}
      }catch(e2){
        if(readErr)throw new Error('read failed: '+readErr.message+' • metadata failed: '+e2.message);
        throw e2;
      }
    }
    window.LAST_LL_TEXT=text;
    if(!text)throw new Error('Drive ตอบกลับว่าง');
    if(text.length<200)throw new Error('ข้อมูลสั้นผิดปกติ ('+text.length+' chars)');
    stage='parse';
    applyLiveLL(parseLLSummary(text));
    if(LL_MONTH_LIST.length===0)throw new Error('parser ทำงานแต่ไม่พบเดือนที่มีข้อมูล');
    window.LAST_LL_PARSE=LL_DATA;
    try{localStorage.setItem('ot_dashboard_ll_last',JSON.stringify({data:LL_DATA,list:LL_MONTH_LIST,at:Date.now()}));}catch(e){}
    document.getElementById('lastUpdate').textContent='อัปเดตล่าสุด: '+new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})+(usedFallback?' (snippet)':'');
    showNotice('✓ โหลด LL สำเร็จ ('+LL_MONTH_LIST.length+' เดือน)','success');
    go(page);
  }catch(err){
    showNotice('✗ ['+stage+'] '+err.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='Refresh from Drive';}
  }
}

function extractSection(text,name){
  const i=text.indexOf('# '+name);if(i<0)return null;
  const lines=text.slice(i).split('\n');
  let endIdx=lines.length;
  for(let j=1;j<lines.length;j++){if(/^# /.test(lines[j])){endIdx=j;break;}}
  return lines.slice(0,endIdx).join('\n');
}

function parsePSAFromTemplate(text){
  const teamsBody=extractSection(text,'PSA_Teams');
  const codesBody=extractSection(text,'PSA_Codes');
  const flBody=extractSection(text,'PSA_Flights');
  const otBody=extractSection(text,'PSA_OT');
  const v1Body=(!teamsBody&&!otBody)?extractSection(text,'PSA_Data'):null;
  if(!teamsBody&&!codesBody&&!flBody&&!otBody&&!v1Body)return 0;

  const newPSA={};
  function ensureMonth(mk){
    if(!newPSA[mk])newPSA[mk]={weeks:['W1: 1-7','W2: 8-14','W3: 15-21','W4: 22-31'],flightCounts:[0,0,0,0],teams:{},codes:{}};
  }
  function ensureTeam(mk,team){
    if(!newPSA[mk].teams[team])newPSA[mk].teams[team]={hours:['0:00','0:00','0:00','0:00'],flights:[0,0,0,0],codes:{}};
  }
  function parseRows(body,callback){
    if(!body)return 0;
    const lines=body.split('\n');
    let hdr=null;let n=0;
    for(const ln of lines){
      const cells=pipeRow(ln);if(!cells)continue;
      if(/^:-+:?$/.test(cells[0]))continue;
      if(!hdr){hdr=cells.map(c=>c.toLowerCase());continue;}
      if(cells.every(c=>!c||c.trim()==='-'))continue;
      const obj={};cells.forEach((v,i)=>{obj[hdr[i]]=v;});
      if(callback(obj))n++;
    }
    return n;
  }

  let count=0;
  function minToHHMM(m){const h=Math.floor(m/60),mn=Math.round(m%60);return h+':'+String(mn).padStart(2,'0');}

  count+=parseRows(teamsBody,obj=>{
    const year=parseInt(obj.year);const month=obj.month;const week=obj.week;const team=obj.team;
    if(!year||!month||!week||!team)return false;
    const monthAbbr=month.length>3?month.slice(0,3):month;
    if(!Object.values(MONTH_ABBR).includes(monthAbbr))return false;
    const mk=monthAbbr+' '+year;
    const wi=parseInt(String(week).replace(/[^\d]/g,''))-1;
    if(wi<0||wi>3)return false;
    ensureMonth(mk);ensureTeam(mk,team);
    const hhmm=String(obj.ot_hhmm||'').trim()||'0:00';
    newPSA[mk].teams[team].hours[wi]=hhmm;
    return true;
  });

  count+=parseRows(codesBody,obj=>{
    const year=parseInt(obj.year);const month=obj.month;const week=obj.week;const code=(obj.code||'').toUpperCase();
    if(!year||!month||!week||!code)return false;
    if(!/^A[1-8]$/.test(code))return false;
    const monthAbbr=month.length>3?month.slice(0,3):month;
    if(!Object.values(MONTH_ABBR).includes(monthAbbr))return false;
    const mk=monthAbbr+' '+year;
    const wi=parseInt(String(week).replace(/[^\d]/g,''))-1;
    if(wi<0||wi>3)return false;
    const min=spanToMin(obj.ot_hhmm||'0:00');
    ensureMonth(mk);
    if(!newPSA[mk].codes[code])newPSA[mk].codes[code]={mins:[0,0,0,0]};
    newPSA[mk].codes[code].mins[wi]+=min;
    return true;
  });

  count+=parseRows(otBody,obj=>{
    const year=parseInt(obj.year);const month=obj.month;const week=obj.week;const team=obj.team;const code=(obj.code||'').toUpperCase();
    if(!year||!month||!week||!team)return false;
    const monthAbbr=month.length>3?month.slice(0,3):month;
    if(!Object.values(MONTH_ABBR).includes(monthAbbr))return false;
    const mk=monthAbbr+' '+year;
    const wi=parseInt(String(week).replace(/[^\d]/g,''))-1;
    if(wi<0||wi>3)return false;
    const hhmm=String(obj.ot_hhmm||'').trim()||'0:00';
    const min=spanToMin(hhmm);
    ensureMonth(mk);ensureTeam(mk,team);
    const prevMin=spanToMin(newPSA[mk].teams[team].hours[wi]);
    newPSA[mk].teams[team].hours[wi]=minToHHMM(prevMin+min);
    if(code&&/^A[1-8]$/.test(code)){
      if(!newPSA[mk].teams[team].codes[code])newPSA[mk].teams[team].codes[code]={mins:[0,0,0,0]};
      newPSA[mk].teams[team].codes[code].mins[wi]+=min;
      if(!newPSA[mk].codes[code])newPSA[mk].codes[code]={mins:[0,0,0,0]};
      newPSA[mk].codes[code].mins[wi]+=min;
    }
    return true;
  });

  count+=parseRows(flBody,obj=>{
    const year=parseInt(obj.year);const month=obj.month;const week=obj.week;const team=obj.team;
    if(!year||!month||!week||!team)return false;
    const monthAbbr=month.length>3?month.slice(0,3):month;
    if(!Object.values(MONTH_ABBR).includes(monthAbbr))return false;
    const mk=monthAbbr+' '+year;
    const wi=parseInt(String(week).replace(/[^\d]/g,''))-1;
    if(wi<0||wi>3)return false;
    const fl=parseInt(obj.flights||'0')||0;
    ensureMonth(mk);ensureTeam(mk,team);
    newPSA[mk].teams[team].flights[wi]=fl;
    return true;
  });
  Object.keys(newPSA).forEach(mk=>{
    const m=newPSA[mk];
    m.flightCounts=[0,0,0,0];
    Object.values(m.teams).forEach(t=>{for(let i=0;i<4;i++)m.flightCounts[i]+=t.flights[i]||0;});
  });

  if(v1Body){
    count+=parseRows(v1Body,obj=>{
      const year=parseInt(obj.year);const month=obj.month;const week=obj.week;const team=obj.team;
      if(!year||!month||!week||!team)return false;
      const monthAbbr=month.length>3?month.slice(0,3):month;
      if(!Object.values(MONTH_ABBR).includes(monthAbbr))return false;
      const mk=monthAbbr+' '+year;
      const wi=parseInt(String(week).replace(/[^\d]/g,''))-1;
      if(wi<0||wi>3)return false;
      ensureMonth(mk);ensureTeam(mk,team);
      const hhmm=String(obj.ot_hhmm||'').trim();
      if(hhmm)newPSA[mk].teams[team].hours[wi]=hhmm;
      const fl=parseInt(obj.flights||'0')||0;
      newPSA[mk].teams[team].flights[wi]=fl;
      newPSA[mk].flightCounts[wi]+=fl;
      return true;
    });
  }

  if(count>0){
    Object.keys(PSA_DATA).forEach(k=>delete PSA_DATA[k]);
    Object.keys(newPSA).forEach(k=>{PSA_DATA[k]=newPSA[k];});
    const sorted=Object.keys(newPSA).map(k=>{
      const m=k.match(/^([A-Z][a-z]{2}) (\d{4})$/);
      return{key:k,year:+m[2],mo:Object.values(MONTH_ABBR).indexOf(m[1])};
    }).sort((a,b)=>a.year-b.year||a.mo-b.mo).map(x=>x.key);
    PSA_MONTHS.length=0;sorted.forEach(k=>PSA_MONTHS.push(k));
    Object.values(newPSA).forEach(mr=>{
      TEAMS.forEach(t=>{if(!mr.teams[t.code])mr.teams[t.code]={hours:['0:00','0:00','0:00','0:00'],flights:[0,0,0,0],codes:{}};});
    });
  }
  return count;
}

function psaCodeMonth(mk,code){const d=PSA_DATA[mk];if(!d||!d.codes||!d.codes[code])return 0;return d.codes[code].mins.reduce((a,b)=>a+b,0);}
function psaCodeAll(code){return PSA_MONTHS.reduce((a,mk)=>a+psaCodeMonth(mk,code),0);}
function psaTeamCodeMonth(mk,team,code){const t=PSA_DATA[mk]&&PSA_DATA[mk].teams&&PSA_DATA[mk].teams[team];if(!t||!t.codes||!t.codes[code])return 0;return t.codes[code].mins.reduce((a,b)=>a+b,0);}

function parseLLFromTemplate(text){
  const body=extractSection(text,'LL_Data');if(!body)return 0;
  const lines=body.split('\n');
  let hdr=null;let count=0;
  const newLL={};
  for(const ln of lines){
    const cells=pipeRow(ln);if(!cells)continue;
    if(/^:-+:?$/.test(cells[0]))continue;
    if(!hdr){hdr=cells.map(c=>c.toLowerCase());continue;}
    if(cells.every(c=>!c||c.trim()==='-'))continue;
    const obj={};cells.forEach((v,i)=>{obj[hdr[i]]=v;});
    const year=parseInt(obj.year);const month=obj.month;const cat=obj.category;const code=obj.code;
    if(!year||!month||!cat)continue;
    const monthAbbr=month.length>3?month.slice(0,3):month;
    if(!Object.values(MONTH_ABBR).includes(monthAbbr))continue;
    const mk=monthAbbr+' '+year;
    const min=spanToMin(obj.ot_hhmm||'0:00');
    if(!newLL[mk])newLL[mk]={LL_min:0,Porter_min:0,Admin_min:0,Total_min:0,codes:{}};
    if(['LL','Porter','Admin'].includes(cat)){
      newLL[mk][cat+'_min']+=min;
      newLL[mk].Total_min+=min;
      if(code&&/^A[1-8]$/.test(code)){
        if(!newLL[mk].codes[code])newLL[mk].codes[code]={LL_min:0,Porter_min:0,Admin_min:0};
        newLL[mk].codes[code][cat+'_min']+=min;
      }
    }
    count++;
  }
  if(count>0){
    applyLiveLL(newLL);
    try{localStorage.setItem('ot_dashboard_ll_last',JSON.stringify({data:LL_DATA,list:LL_MONTH_LIST,at:Date.now()}));}catch(e){}
    document.getElementById('lastUpdate').textContent='อัปเดตล่าสุด: '+new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})+' (template)';
  }
  return count;
}

function handlePsaCsv(e){
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();

  };

  e.target.value='';
}
function parsePsaFlightCsv(text){
  const TEAM_MAP={EK:'EK',UO:'EK',FY:'EK','6B':'EK',BY:'EK',SQ:'SQ',CX:'SQ',LY:'SQ',EY:'EY',AY:'EY',DV:'EY',TR:'TR',QP:'TR','6E':'TR',WY:'WY',G9:'WY','9C':'WY',DK:'WY',JQ:'JQ',IT:'JQ',IX:'JQ',AI:'JQ',N0:'JQ',TK:'TK',VJ:'TK',SG:'TK',HY:'TK',OD:'TK',KC:'KC',LJ:'KC',KE:'KC',OZ:'KC',NO:'KC',AF:'KC',QR:'QR',MH:'QR',OM:'QR',DE:'QR',AK:'AK',QZ:'AK','8M':'AK',SU:'SU',W5:'SU',B2:'SU','3U':'CHN','9H':'CHN',AQ:'CHN',CA:'CHN',CZ:'CHN',FM:'CHN',HU:'CHN',HO:'CHN',HX:'CHN',MU:'CHN',ZF:'CHARTER',EO:'CHARTER',WZ:'CHARTER',N4:'CHARTER',G2:'CHARTER',LO:'CHARTER',HH:'CHARTER',H4:'CHARTER',S7:'CHARTER',C6:'CHARTER',SV:'SV',WK:'SV',KA:'SV',PG:'PG',PVT:'PVT'};
  const M={JAN:'Jan',FEB:'Feb',MAR:'Mar',APR:'Apr',MAY:'May',JUN:'Jun',JUL:'Jul',AUG:'Aug',SEP:'Sep',OCT:'Oct',NOV:'Nov',DEC:'Dec'};
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw new Error('CSV ว่างเปล่า');
  const hdr=lines[0].split(',').map(s=>s.replace(/"/g,'').trim().toLowerCase());
  const dateIdx=hdr.findIndex(h=>h.startsWith('date')||h==='วันที่');
  const airIdx=hdr.findIndex(h=>h.includes('airline'));
  const typeIdx=hdr.findIndex(h=>h.includes('type'));
  if(dateIdx<0||airIdx<0)throw new Error('ไม่พบคอลัมน์ Date หรือ Airlines');
  const counters={},totals={},detected=new Set();
  let cancelled=0,active=0;
  lines.slice(1).forEach(l=>{
    const c=l.split(',').map(s=>s.replace(/"/g,'').trim());
    const ds=c[dateIdx];if(!ds)return;
    const dt=new Date(ds);if(isNaN(dt))return;
    const day=dt.getDate(),mo=dt.getMonth()+1,yr=dt.getFullYear();
    const monthLabel=Object.values(M)[mo-1]+' '+yr;
    if(!PSA_DATA[monthLabel])return;
    detected.add(monthLabel);
    const wIdx=day<=7?0:day<=14?1:day<=21?2:3;
    if(typeIdx>=0&&(c[typeIdx]||'').toLowerCase()==='cancelled'){cancelled++;return;}
    active++;
    if(!totals[monthLabel])totals[monthLabel]=[0,0,0,0];
    totals[monthLabel][wIdx]++;
    const team=TEAM_MAP[(c[airIdx]||'').toUpperCase()];
    if(team){
      if(!counters[monthLabel])counters[monthLabel]={};
      if(!counters[monthLabel][team])counters[monthLabel][team]=[0,0,0,0];
      counters[monthLabel][team][wIdx]++;
    }
  });
  detected.forEach(mk=>{
    PSA_DATA[mk].flightCounts=totals[mk]||[0,0,0,0];
    Object.keys(counters[mk]||{}).forEach(t=>{
      if(PSA_DATA[mk].teams[t])PSA_DATA[mk].teams[t].flights=counters[mk][t];
    });
  });
}

window.closeEditForm=function(){document.getElementById('editModal').classList.remove('show');editingMk=null;};
window.saveEditForm=function(){
  if(!editingMk)return;
  function p(v){if(!v)return 0;const m=v.trim().match(/^(\d+):(\d+)/);return m?parseInt(m[1])*60+parseInt(m[2]):Math.round(parseFloat(v)*60)||0;}
  const LL=p(document.getElementById('ed-LL').value);
  const Porter=p(document.getElementById('ed-Porter').value);
  const Admin=p(document.getElementById('ed-Admin').value);
  const codes={};
  LL_CODES.forEach(code=>codes[code]={LL_min:0,Porter_min:0,Admin_min:0});
  document.querySelectorAll('#editBody .code-input').forEach(inp=>{
    const code=inp.dataset.code,cat=inp.dataset.cat,v=p(inp.value);
    codes[code][cat+'_min']=v;
  });
  LL_OVERRIDES[editingMk]={LL_min:LL,Porter_min:Porter,Admin_min:Admin,Total_min:LL+Porter+Admin,codes,weeks:undefined};
  try{localStorage.setItem('ot_dashboard_ll_overrides',JSON.stringify(LL_OVERRIDES));}catch(e){}
  closeEditForm();
  go(page);
  showNotice('✓ บันทึก '+editingMk+' (override) สำเร็จ','success');
};
window.resetMonthOverride=function(){
  if(!editingMk)return;
  if(!confirm('ลบการแก้ไขของ '+editingMk+' และกลับไปใช้ข้อมูลเดิม?'))return;
  delete LL_OVERRIDES[editingMk];
  try{localStorage.setItem('ot_dashboard_ll_overrides',JSON.stringify(LL_OVERRIDES));}catch(e){}
  closeEditForm();
  go(page);
};

window.exportCsv=function(){
  const rows=[];
  rows.push(['OT Dashboard — '+(dept==='PSA'?'PSA Teams':'LL Categories'),'Generated '+new Date().toISOString()]);
  rows.push([]);
  if(dept==='PSA'){
    rows.push(['PSA Summary','',...PSA_MONTHS,'Grand Total']);
    [...TEAMS].sort((a,b)=>teamAllPSA(b.code)-teamAllPSA(a.code)).forEach(t=>{
      rows.push([t.name,t.airlines,...PSA_MONTHS.map(mk=>fmtH(tmTotal(mk,t.code))),fmtH(teamAllPSA(t.code))]);
    });
    rows.push(['Grand Total','',...PSA_MONTHS.map(mk=>fmtH(mTotalPSA(mk))),fmtH(allTotalPSA())]);
    rows.push([]);rows.push(['Flights per month','',...PSA_MONTHS.map(mk=>PSA_DATA[mk].flightCounts.reduce((a,b)=>a+b,0)),'']);
  }else{
    rows.push(['LL Summary','LL','Porter','Admin','Total',...LL_CODES]);
    LL_MONTH_LIST.forEach(mk=>{
      rows.push([mk,fmtH(llCatMonth(mk,'LL')),fmtH(llCatMonth(mk,'Porter')),fmtH(llCatMonth(mk,'Admin')),fmtH(llTotalMonth(mk)),...LL_CODES.map(c=>fmtH(llCodeMonth(mk,c)))]);
    });
    rows.push(['Grand Total',fmtH(llCatAll('LL')),fmtH(llCatAll('Porter')),fmtH(llCatAll('Admin')),fmtH(llTotalAll()),...LL_CODES.map(c=>fmtH(llCodeAll(c)))]);
  }
  const csv=rows.map(r=>r.map(c=>{const s=String(c||'');return s.includes(',')||s.includes('"')?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`OT-${dept}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();URL.revokeObjectURL(a.href);
  showNotice('✓ Export CSV สำเร็จ','success');
};

/* ============== AUTO-REFRESH ============== */
let AUTO_ON=true;
let AUTO_TIMER=null;
let LAST_AUTO_AT=0;
let LAST_HIDDEN_AT=0;

function setupAutoRefresh(){
  if(AUTO_TIMER)clearInterval(AUTO_TIMER);
  if(AUTO_ON){
    AUTO_TIMER=setInterval(()=>{
      if(document.visibilityState==='visible'){autoRefreshAll();}
    },AUTO_REFRESH_INTERVAL_MIN*60*1000);
  }
  document.getElementById('autoLbl').textContent=AUTO_ON?'Auto: ON · '+AUTO_REFRESH_INTERVAL_MIN+' min':'Auto: OFF';
  document.getElementById('btnAuto').classList.toggle('success',AUTO_ON);
}

window.toggleAutoRefresh=function(){
  AUTO_ON=!AUTO_ON;
  try{localStorage.setItem('ot_dashboard_auto',AUTO_ON?'1':'0');}catch(e){}
  setupAutoRefresh();
  showNotice(AUTO_ON?('✓ เปิด Auto-refresh ทุก '+AUTO_REFRESH_INTERVAL_MIN+' นาที'):'⏸ ปิด Auto-refresh','info');
};

async function autoRefreshAll(){
  LAST_AUTO_AT=Date.now();
  if(fetchFromAppsScript())return;
  if(!window.cowork||!window.cowork.callMcpTool)return;
  if(TEMPLATE_FILE_ID){
    try{await refreshFromTemplate(true);go(page);}catch(e){}
  }else{
    try{await refreshLL();}catch(e){}
  }
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){LAST_HIDDEN_AT=Date.now();return;}
  if(document.visibilityState==='visible'&&AUTO_ON){
    const hiddenFor=LAST_HIDDEN_AT?(Date.now()-LAST_HIDDEN_AT):0;
    if(hiddenFor>=VISIBILITY_REFRESH_THRESHOLD_MS){autoRefreshAll();}
  }
});

/* ============== INIT ============== */
const HARDCODED_LL_MONTHS = Object.keys(LL_DATA).length;
function loadOverrides(){
  try{const s=localStorage.getItem('ot_dashboard_ll_overrides');if(s)LL_OVERRIDES=JSON.parse(s);}catch(e){}
  try{
    const c=localStorage.getItem('ot_dashboard_ll_last');
    if(c){
      const o=JSON.parse(c);
      // Merge cached months over the hardcoded baseline instead of replacing it.
      // A stale cache (e.g. one saved before May was filled in) can no longer
      // wipe out a curated month — applyLiveLL only overrides months that
      // actually carry data, so the baseline stays as the floor.
      if(o.data&&typeof o.data==='object'){
        applyLiveLL(o.data);
        if(o.at)document.getElementById('lastUpdate').textContent='cache: '+new Date(o.at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
      }else{
        localStorage.removeItem('ot_dashboard_ll_last');
      }
    }
  }catch(e){}
  try{const a=localStorage.getItem('ot_dashboard_auto');if(a==='0')AUTO_ON=false;}catch(e){}
  try{TEMPLATE_FILE_ID=localStorage.getItem('ot_dashboard_template_id')||'';}catch(e){}
}

// ========== Apps Script live-fetch bridge ==========
function applyServerData(srv){
  try{
    if(!srv||typeof srv!=='object')return;
    const summary=[];
    if(srv.LL && Object.keys(srv.LL).length>0 && !srv.LL._error){
      applyLiveLL(srv.LL);
      summary.push('LL '+Object.keys(LL_DATA).length+' เดือน');
    }
    window.LAST_FLIGHTS_RAW = srv.Flights;
    if(srv.Flights && !srv.Flights._error){
      let updatedMonths=0,totalActive=0,totalCancelled=0;
      Object.keys(srv.Flights).forEach(mk=>{
        if(mk.startsWith('_'))return;
        const f=srv.Flights[mk];
        if(!f||!f.flightCounts)return;
        if(!PSA_DATA[mk])return;
        PSA_DATA[mk].flightCounts = f.flightCounts.slice();
        Object.keys(PSA_DATA[mk].teams).forEach(t=>{PSA_DATA[mk].teams[t].flights=[0,0,0,0];});
        Object.keys(f.teams||{}).forEach(t=>{if(PSA_DATA[mk].teams[t])PSA_DATA[mk].teams[t].flights=f.teams[t].slice();});
        updatedMonths++;
        totalActive += f.flightCounts.reduce((a,b)=>a+b,0);
        totalCancelled += (f.cancelled||0);
      });
      if(updatedMonths>0)summary.push('Flights '+totalActive+' เที่ยว ('+updatedMonths+' เดือน, ตัด '+totalCancelled+' Cancelled)');
    }
    const cachedNote = srv.cached?' (cached)':'';
    showNotice('✓ ดึงข้อมูลจาก Google Sheets'+cachedNote+(summary.length?' — '+summary.join(' • '):''),'success');
    document.getElementById('lastUpdate').textContent='Live: '+new Date().toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})+cachedNote;
    go(page);
  }catch(e){
    showNotice('✗ Apply ข้อมูลล้มเหลว: '+e.message,'error');
  }
}

function fetchFromAppsScript(){
  if(typeof google==='undefined'||!google.script||!google.script.run){return false;}
  showNotice('กำลังดึงข้อมูลจาก Google Sheets...','info');
  google.script.run
    .withSuccessHandler(applyServerData)
    .withFailureHandler(err=>{showNotice('✗ Apps Script: '+(err&&err.message||err),'error');})
    .getAllData();
  return true;
}

const _origRefreshAll = window.refreshAll;
window.refreshAll = async function(){
  if(fetchFromAppsScript()) return;
  if(_origRefreshAll) return _origRefreshAll();
};

(function init(){
  loadOverrides();
  if(Object.keys(LL_DATA).length>0){LL_MONTH_LIST = activeMonths(LL_DATA);}
  const hdr=document.getElementById('dashHeader');
  if(hdr) hdr.setAttribute('data-date', new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}));
  window.addEventListener('beforeprint',()=>{Object.values(CH).forEach(c=>{try{c&&c.resize();}catch(e){}});});
  window.addEventListener('afterprint',()=>{Object.values(CH).forEach(c=>{try{c&&c.resize();}catch(e){}});});
  updateTemplateLabel();
  renderTabs();
  renderPSAOverview();
  setupAutoRefresh();
  setTimeout(()=>{
    if(typeof google!=='undefined'&&google.script&&google.script.run){fetchFromAppsScript();return;}
    function tryAutoFetch(retries){
      if(!TEMPLATE_FILE_ID){return;}
      if(!window.cowork||!window.cowork.callMcpTool){
        if(retries>0){setTimeout(()=>tryAutoFetch(retries-1),700);return;}
        return;
      }
      if(_origRefreshAll)_origRefreshAll();
    }
    tryAutoFetch(5);
  },350);
})();
