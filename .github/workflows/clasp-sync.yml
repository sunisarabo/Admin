name: Sync to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'service-request/**'
      - '.github/workflows/clasp-sync.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also bump Web App deployment version (URL stays the same)?'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./service-request
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp (v3)
        run: npm install -g @google/clasp@^3.0.0

      - name: Restore clasp credentials
        run: |
          echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        working-directory: .

      - name: Diagnose credentials (no secret leakage)
        run: |
          echo "clasp version: $(clasp --version 2>&1 || echo unknown)"
          echo "HOME: $HOME"
          echo "File exists: $([ -f "$HOME/.clasprc.json" ] && echo yes || echo NO)"
          echo "File size (bytes): $(wc -c < "$HOME/.clasprc.json" 2>/dev/null || echo NA)"
          FIRST=$(head -c 1 "$HOME/.clasprc.json" 2>/dev/null | od -An -c | tr -d ' ')
          LAST=$(tail -c 1 "$HOME/.clasprc.json" 2>/dev/null | od -An -c | tr -d ' ')
          echo "First char: '$FIRST'   (expected: '{')"
          echo "Last char:  '$LAST'   (expected: '}' or '\\n')"
          echo "Top-level JSON keys:"
          node -e "try { const j=JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); console.log('  ✓ valid JSON, keys:', Object.keys(j).join(', ')); } catch(e) { console.log('  ✗ invalid JSON:', e.message.split('\\n')[0]); }"
        working-directory: .

      - name: clasp push (source → Apps Script HEAD)
        run: clasp push --force

      - name: clasp deploy (advance Web App version)
        if: ${{ inputs.deploy }}
        env:
          DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Auto-deploy ${SHA::7}"
          else
            clasp deploy --description "Auto-deploy ${SHA::7}"
          fi
